# Hourly weather collection, scheduled and hosted free on GitHub Actions.
#
# WHERE THIS GOES: copy it to  .github/workflows/collect_weather.yml  at the ROOT
# of your repo (not inside the hosting/ folder). GitHub only runs workflows that
# live in .github/workflows/ on the default branch.
#
# WHAT IT DOES: every hour it checks out the repo, installs Python, runs the
# collector, and commits any new Parquet/JSON files back to the repo — so your
# data lake grows automatically and is visible right there on GitHub.

name: Collect weather

on:
  # Run at 7 minutes past every hour. We avoid :00 on purpose — scheduled jobs
  # are busiest (and most delayed/dropped) right at the top of the hour.
  schedule:
    - cron: "7 * * * *"
  # Also let you trigger it by hand from the Actions tab, to test without waiting.
  workflow_dispatch:

# The job needs permission to push the new data files back to the repo.
permissions:
  contents: write

# If a run is somehow still going when the next hour fires, don't pile up.
concurrency:
  group: collect-weather
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the collector
        run: python run_pipeline.py

      - name: Commit the new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          # Only commit if something actually changed, so empty hours don't fail.
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: weather collection $(date -u '+%Y-%m-%dT%H:%MZ')"
            git push
          fi
